# Builds and, where a proof exists, checks it — the same three languages the repository is
# about, run independently. This is the cheapest evidence that the claims in the READMEs
# type-check: no `sorry` in Lean, no unproved lemma in Dafny, and every translator compiles.
#
# What this does NOT run: Tests/scripts/check.sh, which needs the mCRL2 toolset and SNAKES,
# and is heavier than a build workflow should be. See Tests/README.md for how to run that
# by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    name: Lean — Proof/, the translator, and the bridge
    runs-on: self-hosted
    steps:
      # clean: false keeps .lake/packages/mathlib on disk between runs on this persistent
      # runner. With the default `git clean -ffdx`, every run re-downloaded Mathlib's ~2.8GB
      # olean cache from scratch, and use-mathlib-cache's own re-upload of that to GitHub's
      # Actions cache saturated this connection's upload and got the job cancelled outright
      # (observed: stuck at 54% for 17 minutes, then "The operation was canceled") — so this
      # replaces a remote cache that doesn't fit the connection with the local disk that's
      # already sitting right there.
      - uses: actions/checkout@v4
        with:
          clean: false

      # Order matters: Proof/ populates the shared Mathlib download that Bridge/ points at
      # (Implementation/Lean/Bridge/lakefile.toml sets packagesDir to Proof/.lake/packages,
      # so it never fetches Mathlib a second time), and Bridge/ requires Cpn2mCrl2 by path,
      # so building that translator before Bridge means nothing there is fetched blind.
      #
      # use-mathlib-cache is left off everywhere: it's the GitHub Actions cache upload/download
      # that just proved unreliable here, and `lake exe cache get` is already fast on a repeat
      # run once .lake/packages/mathlib is on disk from the run before.
      - name: Proof/ — the formalization, Theorem 1 included
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Proof
          use-mathlib-cache: "false"

      - name: Implementation/Lean/ — translator #1 (no Mathlib dependency)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Implementation/Lean
          use-mathlib-cache: "false"

      - name: Implementation/Lean/Bridge/ — composes T2 with Theorem 1
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Implementation/Lean/Bridge
          use-mathlib-cache: "false"

      - name: Translate Example 3, both encodings
        run: |
          BIN=Implementation/Lean/.lake/build/bin/cpn2mcrl2
          "$BIN" Implementation/Lean/fixtures/counter.cpn.json /tmp/counter.mcrl2
          "$BIN" --list Implementation/Lean/fixtures/counter.cpn.json /tmp/counter.list.mcrl2
          echo "--- bag encoding ---"; cat /tmp/counter.mcrl2
          echo "--- list encoding ---"; cat /tmp/counter.list.mcrl2

  dafny:
    name: Dafny — build and verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # setup-dafny-action shells out to actions/setup-dotnet internally (dafny build
      # --target:cs needs a dotnet to compile the C# it emits), which defaults to installing
      # into /usr/share/dotnet — root this self-hosted runner doesn't have. Pointing
      # DOTNET_INSTALL_DIR at a writable path first (its documented self-hosted-runner escape
      # hatch) fixes that without touching the action itself; confirmed against this runner.
      - name: Point .NET installs at a writable directory
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      # Its release archive bundles Z3 too (confirmed: 4.12.1 and 4.14.1 ship inside it) and
      # Dafny resolves it on its own — no separate Z3 install needed.
      - name: Install Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Build
        working-directory: Implementation/Dafny
        run: dafny build --standard-libraries --target:cs --output cpn2mcrl2 src/*.dfy

      # Scoped to the files the README's own table calls proved, rather than src/*.dfy: with
      # --warn-contradictory-assumptions, that flag's stricter assertion mode makes one VC in
      # Import.dfy (outside the trust boundary, and not part of any claim below) time out --
      # reproduced locally, unrelated to whether anything is actually proved. Dropping either
      # the file or the flag avoids it; here it's the file, since the flag is what the vacuity
      # claim needs and Import.dfy was never part of that claim.
      - name: Verify — the proof obligations, checked by Z3, checked for vacuity
        working-directory: Implementation/Dafny
        run: >
          dafny verify --standard-libraries --warn-contradictory-assumptions
          src/Util.dfy src/Color.dfy src/Bag.dfy src/ListOps.dfy src/Expr.dfy src/Typing.dfy
          src/Net.dfy src/Semantics.dfy src/Lpe.dfy src/Translate.dfy src/Correct.dfy
          src/ListEncoding.dfy src/Print.dfy src/PrintList.dfy

      - name: Translate Example 3, both encodings
        working-directory: Implementation/Dafny
        run: |
          ./cpn2mcrl2 fixtures/counter.cpn.json /tmp/counter.mcrl2
          ./cpn2mcrl2 --list fixtures/counter.cpn.json /tmp/counter.list.mcrl2
          echo "--- bag encoding ---"; cat /tmp/counter.mcrl2
          echo "--- list encoding ---"; cat /tmp/counter.list.mcrl2

  ocaml:
    name: OCaml — translator #3
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # This runner already carries a named switch with the translator's one real dependency
      # (yojson, used only by the importer, which is outside the trust boundary) installed —
      # built and confirmed working during setup, so it's used as-is rather than paying for a
      # fresh compiler + package fetch on every run. A runner without it would need
      # ocaml/setup-ocaml@v3 plus `opam install dune yojson` here instead.
      - name: Build
        working-directory: Implementation/OCaml
        run: |
          eval $(opam env --switch=cpn2mcrl2 --set-switch)
          dune build

      - name: Translate Example 3, both encodings
        working-directory: Implementation/OCaml
        run: |
          eval $(opam env --switch=cpn2mcrl2 --set-switch)
          BIN=_build/default/bin/main.exe
          "$BIN" fixtures/counter.cpn.json /tmp/counter.mcrl2
          "$BIN" --list fixtures/counter.cpn.json /tmp/counter.list.mcrl2
          echo "--- bag encoding ---"; cat /tmp/counter.mcrl2
          echo "--- list encoding ---"; cat /tmp/counter.list.mcrl2
